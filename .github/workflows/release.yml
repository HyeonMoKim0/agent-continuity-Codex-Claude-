name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.4.0) — created on the current main if missing'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Run test suite (release gate)
        shell: pwsh
        run: ./tests/Run-Tests.ps1
      - name: Package
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          mkdir -p dist/AgentContinuity
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/AgentContinuity/
          cd dist && zip -rq "AgentContinuity-${TAG}.zip" AgentContinuity
          sha256sum "AgentContinuity-${TAG}.zip" > "AgentContinuity-${TAG}.zip.sha256"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh release create "${TAG}" \
            "dist/AgentContinuity-${TAG}.zip" \
            "dist/AgentContinuity-${TAG}.zip.sha256" \
            --target "${GITHUB_SHA}" \
            --title "Agent Continuity ${TAG}" \
            --generate-notes
