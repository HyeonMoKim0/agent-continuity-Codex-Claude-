name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Run test suite (release gate)
        shell: pwsh
        run: ./tests/Run-Tests.ps1
      - name: Package
        run: |
          mkdir -p dist/AgentContinuity
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/AgentContinuity/
          cd dist && zip -rq "AgentContinuity-${GITHUB_REF_NAME}.zip" AgentContinuity
          sha256sum "AgentContinuity-${GITHUB_REF_NAME}.zip" > "AgentContinuity-${GITHUB_REF_NAME}.zip.sha256"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/AgentContinuity-${GITHUB_REF_NAME}.zip" \
            "dist/AgentContinuity-${GITHUB_REF_NAME}.zip.sha256" \
            --title "Agent Continuity ${GITHUB_REF_NAME}" \
            --generate-notes
